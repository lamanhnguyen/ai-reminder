name: VoiceReminders
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: 16.0
  createIntermediateGroups: true
  xcodeVersion: "14.0"
targets:
  VoiceReminders:
    type: application
    platform: iOS
    sources:
      - Sources
      - LaunchScreen.storyboard
    resources:
      - Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.example.VoiceReminders
        WKCompanionAppBundleIdentifier: com.example.VoiceReminders
        CFBundleExecutable: VoiceReminders
        CFBundleName: VoiceReminders
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        NSMicrophoneUsageDescription: We need access to your microphone to record voice commands for creating reminders.
        NSSpeechRecognitionUsageDescription: We need speech recognition to convert your voice commands into reminders.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1,2
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VoiceReminders
        ENABLE_BITCODE: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        INFOPLIST_KEY_CFBundleDisplayName: VoiceReminders
    dependencies:
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
      - sdk: UserNotifications.framework
  VoiceRemindersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Tests/Info.plist
    dependencies:
      - target: VoiceReminders
      - sdk: Speech.framework
      - sdk: AVFoundation.framework 